<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Сајт је у изради</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #191919;
      text-align: center;
    }

    .container {
      max-width: 650px;
    }

    h1 {
      margin-bottom: 18px;
      font-size: clamp(38px, 7vw, 70px);
      line-height: 1.05;
    }

    p {
      margin-bottom: 30px;
      font-size: 19px;
      line-height: 1.6;
      color: #555;
    }

    a {
      display: inline-block;
      padding: 14px 25px;
      border-radius: 30px;
      background: #191919;
      color: white;
      text-decoration: none;
      font-weight: bold;
      transition: transform 0.2s, opacity 0.2s;
    }

    a:hover {
      transform: translateY(-2px);
      opacity: 0.85;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>Сајт је у изради.</h1>

    <p>
      Ускоро вам представљамо наш нови сајт.<br>
      За више информација посетите наш Instagram профил.
    </p>

    <a
      href="https://www.instagram.com/vrticmadagaskar/"
      target="_blank"
      rel="noopener noreferrer"
    >
      Посетите Instagram
    </a>
  </main>
</body>
</html>
